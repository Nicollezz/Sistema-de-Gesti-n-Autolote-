<div class="flex items-center justify-center min-h-screen bg-[#1e3c72]">
  <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-2xl">
    
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Autolote System</h2>
      <p class="text-sm text-slate-500 mt-1">Inicia sesión en tu cuenta</p>
    </div>

    <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm text-center">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Usuario (Correo):</label>
        <input 
          type="email" 
          class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#2a5298] focus:border-transparent text-sm text-slate-700" 
          [(ngModel)]="username" 
          name="username" 
          placeholder="correo@ejemplo.com"
          required
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Contraseña:</label>
        <input 
          type="password" 
          class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#2a5298] focus:border-transparent text-sm text-slate-700" 
          [(ngModel)]="contrasena" 
          name="contrasena" 
          placeholder="••••••••"
          required
        >
      </div>

      <button 
        type="submit" 
        class="w-full py-3 px-4 bg-[#2a5298] hover:bg-[#1e3c72] text-white font-semibold rounded-lg transition duration-200 shadow-md text-sm mt-2"
      >
        Entrar
      </button>
    </form>

    <!-- Enlace de registro reubicado fuera del formulario -->
    <div class="text-center mt-6">
      <a routerLink="/register" class="text-sm text-[#2a5298] hover:underline font-medium">¿No tienes cuenta? Regístrate aquí</a>
    </div>
    
  </div>
</div>
