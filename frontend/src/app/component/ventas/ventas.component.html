<div class="max-w-6xl mx-auto p-6 md:p-8 bg-white shadow-xl rounded-xl mt-6 border border-gray-100">
  <h2 class="text-3xl font-extrabold text-gray-900 mb-6 tracking-tight">Módulo de Ventas</h2>

  <!-- Formulario de Registro de Venta -->
  <div class="bg-gradient-to-br from-gray-50 to-slate-50 p-6 rounded-xl mb-8 border border-gray-200 shadow-inner">
    <h4 class="text-lg font-bold text-gray-800 mb-4">Registrar Nueva Venta</h4>
    
    <form (ngSubmit)="guardarVenta()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        
        <!-- Cliente -->
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">Cliente</label>
          <select 
            [(ngModel)]="nuevaVenta.cliente_id" 
            name="cliente_id" 
            class="p-3 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-700 shadow-sm transition" 
            required>
            <option value="" disabled selected>Seleccione un cliente</option>
            <option *ngFor="let c of clientes" [value]="c.id">{{ c.nombre }} {{ c.apellido }}</option>
          </select>
        </div>

        <!-- ID del Vehículo -->
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">ID del Vehículo</label>
          <input 
            type="number" 
            [(ngModel)]="nuevaVenta.vehiculo_id" 
            name="vehiculo_id" 
            class="p-3 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-700 shadow-sm transition" 
            placeholder="ID del vehículo" 
            required>
        </div>

      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
        
        <!-- Subtotal -->
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">Subtotal</label>
          <input 
            type="number" 
            [(ngModel)]="nuevaVenta.subtotal" 
            name="subtotal" 
            (input)="calcularTotales()" 
            class="p-3 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-700 shadow-sm transition" 
            required>
        </div>

        <!-- Impuesto (15%) -->
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">Impuesto (15%)</label>
          <input 
            type="number" 
            [(ngModel)]="nuevaVenta.impuesto" 
            name="impuesto" 
            class="p-3 border border-gray-200 rounded-lg bg-gray-100 text-gray-600 shadow-sm cursor-not-allowed" 
            readonly>
        </div>

        <!-- Total -->
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">Total</label>
          <input 
            type="number" 
            [(ngModel)]="nuevaVenta.total" 
            name="total" 
            class="p-3 border border-gray-200 rounded-lg bg-gray-100 font-bold text-gray-900 shadow-sm cursor-not-allowed" 
            readonly>
        </div>

      </div>

      <button 
        type="submit" 
        class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold py-3.5 px-6 rounded-lg transition-all shadow-md flex items-center justify-center gap-2">
        Registrar Venta
      </button>
    </form>
  </div>

  <!-- Historial / Listado de Ventas -->
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
    <h4 class="text-lg font-bold text-gray-800 mb-4">Historial de Ventas</h4>
    
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100/75 text-gray-600 uppercase text-xs font-bold tracking-wider">
          <tr>
            <th class="py-3.5 px-6 text-left">ID</th>
            <th class="py-3.5 px-6 text-left">Cliente ID</th>
            <th class="py-3.5 px-6 text-left">Vehículo ID</th>
            <th class="py-3.5 px-6 text-left">Subtotal</th>
            <th class="py-3.5 px-6 text-left">Impuesto</th>
            <th class="py-3.5 px-6 text-left">Total</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 text-gray-700 text-sm">
          <tr *ngFor="let v of ventas" class="hover:bg-emerald-50/40 transition-colors">
            <td class="py-4 px-6 whitespace-nowrap font-semibold text-gray-900">{{ v.id }}</td>
            <td class="py-4 px-6">{{ v.cliente_id }}</td>
            <td class="py-4 px-6">{{ v.vehiculo_id }}</td>
            <td class="py-4 px-6">${{ v.subtotal }}</td>
            <td class="py-4 px-6 text-gray-500">${{ v.impuesto }}</td>
            <td class="py-4 px-6 font-bold text-emerald-600">${{ v.total }}</td>
          </tr>
          <tr *ngIf="ventas.length === 0">
            <td colspan="6" class="py-8 text-center text-gray-400 italic">No hay ventas registradas en el historial.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
