<div class="max-w-6xl mx-auto p-6 bg-white shadow-md rounded-lg mt-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Gestión de Clientes</h2>

  <!-- Formulario para registrar cliente -->
  <div class="bg-gray-50 p-5 rounded-lg mb-8 border border-gray-200 shadow-sm">
    <h3 class="text-lg font-semibold text-gray-700 mb-4">Registrar Nuevo Cliente</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input 
        type="text" 
        [(ngModel)]="nuevoCliente.nombre" 
        placeholder="Nombre" 
        class="p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      
      <input 
        type="text" 
        [(ngModel)]="nuevoCliente.apellido" 
        placeholder="Apellido" 
        class="p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      
      <input 
        type="email" 
        [(ngModel)]="nuevoCliente.correo" 
        placeholder="Correo electrónico" 
        class="p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      
      <input 
        type="text" 
        [(ngModel)]="nuevoCliente.telefono" 
        placeholder="Teléfono" 
        class="p-2.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    
    <button 
      (click)="registrarCliente()" 
      class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-md transition shadow">
      Guardar Cliente
    </button>
  </div>

  <!-- Tabla de listado de clientes -->
  <div class="overflow-x-auto bg-white border border-gray-200 rounded-lg shadow-sm">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-100 text-gray-600 uppercase text-xs font-semibold tracking-wider">
        <tr>
          <th class="py-3 px-6 text-left">Nombre</th>
          <th class="py-3 px-6 text-left">Apellido</th>
          <th class="py-3 px-6 text-left">Correo</th>
          <th class="py-3 px-6 text-left">Teléfono</th>
          <th class="py-3 px-6 text-center">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 text-gray-700 text-sm">
        <tr *ngFor="let c of clientes" class="hover:bg-gray-50 transition">
          <td class="py-3 px-6 whitespace-nowrap">{{ c.nombre }}</td>
          <td class="py-3 px-6">{{ c.apellido }}</td>
          <td class="py-3 px-6">{{ c.correo }}</td>
          <td class="py-3 px-6">{{ c.telefono }}</td>
          <td class="py-3 px-6 text-center">
            <button 
              (click)="eliminarCliente(c.id)" 
              class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-xs font-medium transition shadow-sm">
              Eliminar
            </button>
          </td>
        </tr>
        <tr *ngIf="clientes.length === 0">
          <td colspan="5" class="py-4 text-center text-gray-400">No hay clientes registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
